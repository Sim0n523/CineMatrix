services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinematrix-sqlserver
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=CineMatrix2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cinematrix-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CineMatrix2026!' -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinematrix:latest
    container_name: cinematrix-webapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MoviePlatformDb;User Id=sa;Password=CineMatrix2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - TMDb__ApiKey=${TMDB_API_KEY}
      - TMDb__ImageBaseUrl=https://image.tmdb.org/t/p/w500
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cinematrix-network
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  cinematrix-network:
    driver: bridge
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: cinematrix
  labels:
    app: webapp
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: webapp
        tier: frontend
    spec:
      containers:
      - name: webapp
        image: simonilic/cinematrix:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: webapp-secret
              key: connection-string
        - name: TMDb__ApiKey
          valueFrom:
            secretKeyRef:
              name: webapp-secret
              key: tmdb-api-key
        - name: TMDb__ImageBaseUrl
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: TMDb__ImageBaseUrl
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"